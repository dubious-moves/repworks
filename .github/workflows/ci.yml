name: CI

# Every push and pull request runs the checks, the unit and simulation tests, the build and the
# browser tests. A push to main that passes them all deploys the build to GitHub Pages
# (https://dubious-moves.github.io/repworks/) with the built-in token: no secret is stored.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A branch's newer push cancels its older run. Every commit on main runs in a group of its own,
# so one stuck run never holds up the next; the deploy job's own group puts deploys in order.
concurrency:
  group: ci-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Install Chromium for the browser tests
        run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
      - uses: actions/upload-pages-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages-deploy
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
