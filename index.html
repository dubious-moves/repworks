<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#22412e" />
    <meta name="color-scheme" content="dark" />
    <title>Repworks</title>
    <script>
      // The theme before the first paint (src/app/theme.ts keeps it afterwards).
      try {
        var t = new URLSearchParams(location.search).get('theme') || localStorage.getItem('repworks-theme');
        if (t) document.documentElement.dataset.theme = t;
        // How the boards look (src/app/boardLook.ts checks and keeps these afterwards): the piece
        // set's sheet, the pieces' size and outline, the high-contrast board.
        var root = document.documentElement, p = JSON.parse(localStorage.getItem('repworks-pieces') || '{}');
        if (/^[a-z]+$/.test(p.set) && p.set !== 'cburnett') {
          root.dataset.pieceSet = p.set;
          var link = document.createElement('link');
          link.id = 'piece-set';
          link.rel = 'stylesheet';
          link.href = 'pieces/' + p.set + '.css';
          document.head.append(link);
        }
        if (p.size > 100) (root.dataset.pieces = 'sized'), root.style.setProperty('--piece-size', p.size / 100);
        if (p.outline > 0) (root.dataset.outline = ''), root.style.setProperty('--outline', p.outline);
        if (localStorage.getItem('repworks-contrast-board') === '1') root.dataset.board = 'contrast';
      } catch (e) {}
    </script>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  </head>
  <body>
    <div id="app"></div>
    <noscript>Repworks needs JavaScript.</noscript>
    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
